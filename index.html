<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고려대 맛집 찾기</title>
    <style>
        :root {
            --ku-crimson: #a50034;
            --light-gray: #f4f4f4;
            --white: #ffffff;
            --shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--light-gray);
            color: #333;
        }

        header {
            background-color: var(--ku-crimson);
            color: var(--white);
            padding: 2rem 1rem;
            text-align: center;
            box-shadow: var(--shadow);
        }

        header h1 {
            margin: 0;
            font-size: 1.8rem;
        }

        .container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 2rem;
        }

        input[type="text"] {
            flex: 1;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
        }

        button {
            padding: 0.8rem 1.5rem;
            background-color: var(--ku-crimson);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .restaurant-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--white);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-content {
            padding: 1.5rem;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: bold;
            margin: 0 0 0.5rem 0;
            color: var(--ku-crimson);
        }

        .card-meta {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 1rem;
        }

        .tag {
            display: inline-block;
            background: #eee;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-right: 5px;
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: #888;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<header>
    <h1>🐯 고려대 맛집 파인더</h1>
    <p>안암 캠퍼스 주변 최고의 맛집을 찾아보세요</p>
</header>

<div class="container">
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="메뉴나 식당 이름을 입력하세요...">
        <button onclick="searchRestaurants()">검색</button>
    </div>

    <div class="restaurant-list" id="restaurantList">
        <!-- 맛집 카드가 여기에 동적으로 추가됩니다 -->
    </div>
</div>

<footer>
    &copy; 2024 Korea University Restaurant Guide
</footer>

<script>
    const restaurants = [
        { name: "영철버거", category: "패스트푸드", description: "안암의 전설, 가성비 최고의 스트리트 버거", tags: ["버거", "가성비"] },
        { name: "고른햇살", category: "분식", description: "참치김밥이 일품인 안암 필수 코스", tags: ["김밥", "라볶이"] },
        { name: "무르무르드구스토", category: "양식", description: "분위기 좋은 파스타와 리조또 맛집", tags: ["파스타", "데이트"] },
        { name: "언니네함바그", category: "일식", description: "육즙 가득한 수제 함바그 스테이크", tags: ["함바그", "정식"] },
        { name: "미뇽", category: "디저트", description: "달콤한 타르트와 커피가 맛있는 카페", tags: ["디저트", "카페"] },
        { name: "매스플레이트", category: "양식", description: "푸짐한 양의 목살 스테이크와 필라프", tags: ["스테이크", "단체"] }
    ];

    function displayRestaurants(items) {
        const list = document.getElementById('restaurantList');
        list.innerHTML = '';
        
        items.forEach(res => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-content">
                    <h2 class="card-title">${res.name}</h2>
                    <p class="card-meta">${res.category}</p>
                    <p>${res.description}</p>
                    <div>
                        ${res.tags.map(tag => `<span class="tag">#${tag}</span>`).join('')}
                    </div>
                </div>
            `;
            list.appendChild(card);
        });
    }

    function searchRestaurants() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = restaurants.filter(res => 
            res.name.toLowerCase().includes(query) || 
            res.category.toLowerCase().includes(query) ||
            res.tags.some(tag => tag.toLowerCase().includes(query))
        );
        displayRestaurants(filtered);
    }

    // 초기 표시
    displayRestaurants(restaurants);
</script>

</body>
</html>
